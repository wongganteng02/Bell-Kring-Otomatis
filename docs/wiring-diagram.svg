<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Wiring Diagram – Bel Otomatis MA Al-Ibrohimi</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#64748b">NodeMCU ESP8266 + RTC DS1302 + Relay 1 Channel 5V</text>

  <!-- ===== NodeMCU ===== -->
  <rect x="40" y="80" width="190" height="460" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="135" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">NodeMCU</text>
  <text x="135" y="132" text-anchor="middle" font-size="13" fill="#94a3b8">ESP8266 (ESP-12E)</text>
  <rect x="85" y="150" width="100" height="70" rx="6" fill="#334155"/>
  <text x="135" y="190" text-anchor="middle" font-size="11" fill="#94a3b8">USB Micro</text>
  <text x="135" y="520" text-anchor="middle" font-size="11" fill="#94a3b8">Power: USB / adaptor 5V</text>

  <!-- NodeMCU pins (right edge x=230) -->
  <g font-size="13" font-weight="600" fill="#fff" text-anchor="end">
    <text x="214" y="254">3V3</text>
    <text x="214" y="284">GND</text>
    <text x="214" y="314">D5 (GPIO14)</text>
    <text x="214" y="344">D6 (GPIO12)</text>
    <text x="214" y="374">D7 (GPIO13)</text>
    <text x="214" y="424">VIN (5V)</text>
    <text x="214" y="454">GND</text>
    <text x="214" y="484">D1 (GPIO5)</text>
  </g>
  <g fill="#fbbf24" stroke="#0f172a">
    <circle cx="230" cy="250" r="5"/><circle cx="230" cy="280" r="5"/><circle cx="230" cy="310" r="5"/>
    <circle cx="230" cy="340" r="5"/><circle cx="230" cy="370" r="5"/>
    <circle cx="230" cy="420" r="5"/><circle cx="230" cy="450" r="5"/><circle cx="230" cy="480" r="5"/>
  </g>

  <!-- ===== DS1302 ===== -->
  <rect x="520" y="200" width="200" height="190" rx="12" fill="#0e7490" stroke="#164e63" stroke-width="2"/>
  <text x="620" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">RTC DS1302</text>
  <text x="620" y="408" text-anchor="middle" font-size="11" fill="#0e7490" opacity="0">.</text>
  <g font-size="13" font-weight="600" fill="#fff">
    <text x="540" y="254">VCC</text><text x="540" y="284">GND</text><text x="540" y="314">CLK</text>
    <text x="540" y="344">DAT</text><text x="540" y="374">RST</text>
  </g>
  <g fill="#fbbf24" stroke="#164e63">
    <circle cx="520" cy="250" r="5"/><circle cx="520" cy="280" r="5"/><circle cx="520" cy="310" r="5"/>
    <circle cx="520" cy="340" r="5"/><circle cx="520" cy="370" r="5"/>
  </g>

  <!-- ===== Relay ===== -->
  <rect x="520" y="400" width="200" height="150" rx="12" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
  <text x="620" y="425" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Relay 1 Channel 5V</text>
  <g font-size="13" font-weight="600" fill="#fff">
    <text x="540" y="454">VCC</text><text x="540" y="484">IN</text><text x="540" y="514">GND</text>
  </g>
  <g fill="#fbbf24" stroke="#1e3a8a">
    <circle cx="520" cy="450" r="5"/><circle cx="520" cy="480" r="5"/><circle cx="520" cy="510" r="5"/>
  </g>
  <!-- relay output terminals -->
  <g font-size="13" font-weight="600" fill="#fff" text-anchor="end">
    <text x="704" y="454">COM</text><text x="704" y="484">NO</text><text x="704" y="514">NC</text>
  </g>
  <g fill="#fbbf24" stroke="#1e3a8a">
    <circle cx="720" cy="450" r="5"/><circle cx="720" cy="480" r="5"/><circle cx="720" cy="510" r="5"/>
  </g>

  <!-- ===== Wires NodeMCU -> DS1302 ===== -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="230" y1="250" x2="520" y2="250" stroke="#ef4444"/>
    <line x1="230" y1="280" x2="520" y2="280" stroke="#111827"/>
    <line x1="230" y1="310" x2="520" y2="310" stroke="#f59e0b"/>
    <line x1="230" y1="340" x2="520" y2="340" stroke="#22c55e"/>
    <line x1="230" y1="370" x2="520" y2="370" stroke="#a855f7"/>
    <!-- NodeMCU -> Relay -->
    <line x1="230" y1="420" x2="520" y2="450" stroke="#ef4444"/>
    <line x1="230" y1="480" x2="520" y2="480" stroke="#22c55e"/>
    <line x1="230" y1="450" x2="520" y2="510" stroke="#111827"/>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <text x="375" y="243" fill="#ef4444">3V3</text>
    <text x="375" y="273" fill="#111827">GND</text>
    <text x="375" y="303" fill="#b45309">CLK</text>
    <text x="375" y="333" fill="#15803d">DAT</text>
    <text x="375" y="363" fill="#7e22ce">RST</text>
    <text x="300" y="418" fill="#ef4444">5V</text>
    <text x="375" y="500" fill="#15803d">Sinyal</text>
  </g>

  <!-- ===== Beban (bel) ===== -->
  <rect x="770" y="410" width="170" height="130" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="855" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">BEL / TOA</text>
  <path d="M855 448 c-10 0 -16 8 -16 18 v10 l-6 8 h44 l-6 -8 v-10 c0 -10 -6 -18 -16 -18 z" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
  <circle cx="855" cy="498" r="5" fill="#78350f"/>
  <text x="855" y="520" text-anchor="middle" font-size="11" fill="#78350f">dipasang seri dengan</text>
  <text x="855" y="534" text-anchor="middle" font-size="11" fill="#78350f">sumber listrik bel</text>

  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M720 450 H745 V425 H770" stroke="#dc2626"/>
    <path d="M720 480 H745 V510 H770" stroke="#2563eb"/>
  </g>
  <text x="745" y="400" text-anchor="middle" font-size="11" fill="#dc2626">COM: dari sumber</text>
  <text x="745" y="560" text-anchor="middle" font-size="11" fill="#2563eb">NO: ke bel</text>

  <!-- ===== Legend / catatan ===== -->
  <rect x="40" y="570" width="880" height="1" fill="#e2e8f0"/>
  <text x="40" y="586" font-size="12" fill="#64748b">COM = masuk dari sumber · NO = ke bel (bel bunyi hanya saat relay aktif) · NC tidak dipakai.</text>

  <!-- DS1302 note -->
  <text x="620" y="190" text-anchor="middle" font-size="12" fill="#64748b">Modul RTC dengan baterai CR2032 terpasang</text>
</svg>
